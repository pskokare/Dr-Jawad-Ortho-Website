    <!-- Scroll Progress Bar JavaScript -->
    <script>
        // Scroll Progress Bar Functionality
        document.addEventListener('DOMContentLoaded', function () {
            const scrollProgress = document.getElementById('scrollProgress');
            const scrollProgressBar = document.getElementById('scrollProgressBar');

            // Update scroll progress
            function updateScrollProgress() {
                const scrollTop = document.documentElement.scrollTop || document.body.scrollTop;
                const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                const scrollPercentage = (scrollTop / scrollHeight) * 100;

                // Update progress bar width
                scrollProgressBar.style.width = scrollPercentage + '%';

                // Show/hide progress bar based on scroll position
                if (scrollTop > 100) {
                    scrollProgress.classList.remove('hidden');
                } else {
                    scrollProgress.classList.add('hidden');
                }
            }

            // Throttle function for performance
            function throttle(func, limit) {
                let inThrottle;
                return function () {
                    const args = arguments;
                    const context = this;
                    if (!inThrottle) {
                        func.apply(context, args);
                        inThrottle = true;
                        setTimeout(() => inThrottle = false, limit);
                    }
                }
            }

            // Add scroll event listener with throttling
            window.addEventListener('scroll', throttle(updateScrollProgress, 10));

            // Initial update
            updateScrollProgress();

            // Smooth scroll to top when progress bar is clicked
            scrollProgress.addEventListener('click', function () {
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            });

            // Add hover effect for progress bar
            scrollProgress.addEventListener('mouseenter', function () {
                scrollProgressBar.style.boxShadow = '0 0 20px rgba(202, 138, 4, 0.8)';
            });

            scrollProgress.addEventListener('mouseleave', function () {
                scrollProgressBar.style.boxShadow = '0 0 10px rgba(202, 138, 4, 0.5)';
            });
        });
    </script>

    <!-- Scroll-Triggered Split-Text Heading Reveal -->
    <script>
        (function () {
            var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (reducedMotion || !('IntersectionObserver' in window)) return;
            var isMobile = window.matchMedia('(max-width: 640px)').matches;
            var STAGGER = isMobile ? 0.025 : 0.04;
            var MAX_TOTAL = 0.35;
            var headings = document.querySelectorAll('h1, h2, h3');
            if (!headings.length) return;
            function splitWords(el) {
                var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
                var textNodes = [];
                while (walker.nextNode()) {
                    if (walker.currentNode.nodeValue.trim() !== '') textNodes.push(walker.currentNode);
                }
                textNodes.forEach(function (node) {
                    var frag = document.createDocumentFragment();
                    var parts = node.nodeValue.split(/(\s+)/);
                    parts.forEach(function (part) {
                        if (part === '') return;
                        if (/^\s+$/.test(part)) {
                            frag.appendChild(document.createTextNode(' '));
                        } else {
                            var span = document.createElement('span');
                            span.className = 'st-word';
                            span.textContent = part;
                            frag.appendChild(span);
                        }
                    });
                    node.parentNode.replaceChild(frag, node);
                });
            }
            headings.forEach(function (heading) {
                splitWords(heading);
                var words = heading.querySelectorAll('.st-word');
                if (!words.length) return;
                var step = Math.min(STAGGER, words.length > 1 ? MAX_TOTAL / (words.length - 1) : STAGGER);
                words.forEach(function (word, i) {
                    word.style.setProperty('--st-delay', (i * step).toFixed(3) + 's');
                });
                heading.classList.add('st-split', 'st-pending');
            });
            var observer = new IntersectionObserver(function (entries) {
                entries.forEach(function (entry) {
                    if (!entry.isIntersecting) return;
                    entry.target.classList.add('st-reveal');
                    entry.target.classList.remove('st-pending');
                    observer.unobserve(entry.target);
                });
            }, { threshold: 0.25, rootMargin: '0px 0px -5% 0px' });
            document.querySelectorAll('.st-split').forEach(function (h) {
                observer.observe(h);
            });
        })();
    </script>
